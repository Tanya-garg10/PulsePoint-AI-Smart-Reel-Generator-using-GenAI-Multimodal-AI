<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#AA00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF00AA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="url(#accentGrad)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="url(#accentGrad)" opacity="0.1"/>
  
  <!-- Logo icon -->
  <g transform="translate(100, 200)">
    <!-- Phone/reel shape -->
    <rect x="0" y="0" width="120" height="200" rx="16" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="10" y="10" width="100" height="180" rx="10" fill="#1a1a2e"/>
    
    <!-- Play button -->
    <circle cx="60" cy="100" r="25" fill="url(#accentGrad)" opacity="0.8"/>
    <path d="M 53 85 L 53 115 L 73 100 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Text content -->
  <text x="280" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#accentGrad)">
    PulsePoint AI
  </text>
  
  <text x="280" y="350" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" opacity="0.9">
    Turn Long Videos into Viral Reels
  </text>
  
  <text x="280" y="410" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.7">
    AI-Powered • Instant • Engaging
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(280, 450)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="140" height="50" rx="25" fill="url(#accentGrad)" opacity="0.2"/>
    <text x="70" y="33" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">
      ⚡ Fast AI
    </text>
    
    <!-- Badge 2 -->
    <rect x="160" y="0" width="160" height="50" rx="25" fill="url(#accentGrad)" opacity="0.2"/>
    <text x="240" y="33" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">
      🎯 Auto-Edit
    </text>
    
    <!-- Badge 3 -->
    <rect x="340" y="0" width="140" height="50" rx="25" fill="url(#accentGrad)" opacity="0.2"/>
    <text x="410" y="33" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">
      📱 9:16 HD
    </text>
  </g>
  
  <!-- Decorative waveform -->
  <g opacity="0.3" stroke="url(#accentGrad)" stroke-width="3" fill="none">
    <path d="M 850 200 L 870 200 L 880 180 L 890 220 L 900 200 L 920 200 L 930 170 L 940 230 L 950 200 L 970 200"/>
    <path d="M 850 250 L 870 250 L 880 230 L 890 270 L 900 250 L 920 250 L 930 220 L 940 280 L 950 250 L 970 250"/>
    <path d="M 850 300 L 870 300 L 880 280 L 890 320 L 900 300 L 920 300 L 930 270 L 940 330 L 950 300 L 970 300"/>
  </g>
</svg>
